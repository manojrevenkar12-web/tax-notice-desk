<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Only these fonts, so scans rasterise to the same bytes on every machine. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig-tnd</cachedir>
  <alias><family>Helvetica</family><prefer><family>TeX Gyre Heros</family></prefer></alias>
  <alias><family>Times</family><prefer><family>TeX Gyre Termes</family></prefer></alias>
  <alias><family>Times-Roman</family><prefer><family>TeX Gyre Termes</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>Courier</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>TeX Gyre Heros</family></prefer></alias>
  <alias><family>serif</family><prefer><family>TeX Gyre Termes</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Courier</family></prefer></alias>
</fontconfig>
