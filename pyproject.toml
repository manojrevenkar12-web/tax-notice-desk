[project]
name = "tax-notice-desk"
version = "0.1.0"
description = "Tax notices for a group of German tax firms: read, route, deadline, check, explain, decide."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.2", "pydantic>=2.7", "pyyaml>=6",
  # pinned: generated notices must be byte-identical so that cached OCR replays in CI
  "reportlab==5.1.0", "pypdf==6.21.4", "pillow==13.0.0", "holidays==0.108",
  "pytesseract>=0.3.13", "rank-bm25>=0.2.2", "numpy>=1.26",
  "pyjwt>=2.9", "python-multipart>=0.0.9", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
tnd = "tnd.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tnd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "B008", "SIM102", "SIM108", "SIM117"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
